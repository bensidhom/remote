name: BridgeGuard CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-config:
    name: Deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and deployment scripts
        env:
          BRIDGEGUARD_ENV_FILE: ${{ github.workspace }}/backend/.env.example
          CLOUDFLARE_ENV_FILE: ${{ github.workspace }}/deploy/oci/cloudflare.env.example
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f deploy/oci/compose.yaml config --quiet
          docker compose -f deploy/oci/compose.yaml config |
            grep -q 'platform: linux/amd64'
          docker compose -f deploy/oci/compose.yaml config |
            grep -q 'image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3@sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07'
          test "$(docker compose -f compose.yaml config |
            grep -c '20d1e6057a2e1fa08b45123e41ce9381fc338f0e')" -eq 2
          test "$(docker compose -f deploy/oci/compose.yaml config |
            grep -c '20d1e6057a2e1fa08b45123e41ce9381fc338f0e')" -eq 2
          docker compose -f deploy/oci/compose.yaml config |
            grep -q 'image: cloudflare/cloudflared:2026.7.2-amd64'
          sh -n deploy/oci/backup.sh
          sh -n deploy/oci/preflight.sh
          sh -n deploy/oci/verify.sh

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest
      - name: Bridgette executable runtime benchmark
        env:
          PYTHONPATH: backend
        run: python backend/scripts/run_bridgette_runtime_benchmark.py

  container:
    name: Production container build
    runs-on: ubuntu-latest
    needs: [deployment-config, frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag bridgeguard:${{ github.sha }} .
      - name: Pinned SQLite concurrency and restore gate
        run: >-
          docker run --rm --entrypoint python
          bridgeguard:${{ github.sha }}
          -m scripts.run_sqlite_scale_gate
