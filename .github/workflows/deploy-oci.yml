name: Deploy BridgeGuard to OCI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridgeguard-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: verify
    environment: production
    steps:
      - name: Configure SSH
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -eu
          test -n "$OCI_HOST" || { echo "::error::Missing production environment secret: OCI_HOST"; exit 1; }
          test -n "$OCI_KNOWN_HOSTS" || { echo "::error::Missing production environment secret: OCI_KNOWN_HOSTS"; exit 1; }
          test -n "$OCI_SSH_KEY" || { echo "::error::Missing production environment secret: OCI_SSH_KEY"; exit 1; }
          test -n "$OCI_USER" || { echo "::error::Missing production environment secret: OCI_USER"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/bridgeguard
          chmod 600 ~/.ssh/bridgeguard
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull, rebuild, and verify
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -eu
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/bridgeguard \
            "$OCI_USER@$OCI_HOST" "bash -s -- '$DEPLOY_SHA'" <<'REMOTE'
            set -Eeuo pipefail
            deploy_sha="$1"
            cd /opt/bridgeguard
            git fetch origin main
            git cat-file -e "${deploy_sha}^{commit}"
            git merge-base --is-ancestor "$deploy_sha" origin/main
            git checkout --detach "$deploy_sha"

            sh deploy/oci/preflight.sh
            sh deploy/oci/backup.sh
            docker compose -f deploy/oci/compose.yaml pull embeddings cloudflared
            docker compose -f deploy/oci/compose.yaml up \
              -d --build --remove-orphans --wait --wait-timeout 600
            sh deploy/oci/verify.sh
          REMOTE
