name: Deploy BridgeGuard to OCI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridgeguard-production-${{ vars.BRIDGEGUARD_CUSTOMER_SLUG }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: verify
    environment: production
    steps:
      - name: Configure SSH
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -eu
          test -n "$OCI_HOST" || { echo "::error::Missing production environment secret: OCI_HOST"; exit 1; }
          test -n "$OCI_KNOWN_HOSTS" || { echo "::error::Missing production environment secret: OCI_KNOWN_HOSTS"; exit 1; }
          test -n "$OCI_SSH_KEY" || { echo "::error::Missing production environment secret: OCI_SSH_KEY"; exit 1; }
          test -n "$OCI_USER" || { echo "::error::Missing production environment secret: OCI_USER"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/bridgeguard
          chmod 600 ~/.ssh/bridgeguard
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull, rebuild, and verify
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          DEPLOY_SHA: ${{ github.sha }}
          COMPOSE_ENV_FILE: ${{ vars.BRIDGEGUARD_COMPOSE_ENV_FILE }}
        run: |
          set -eu
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/bridgeguard \
            "$OCI_USER@$OCI_HOST" \
            "deploy_script=\$(mktemp /tmp/bridgeguard-deploy.XXXXXX); \
             trap 'rm -f \"\$deploy_script\"' EXIT; \
             cat >\"\$deploy_script\"; \
             bash \"\$deploy_script\" '$DEPLOY_SHA' '$COMPOSE_ENV_FILE'" <<'REMOTE'
            set -Eeuo pipefail
            deploy_sha="$1"
            compose_env_candidate="$2"
            generated_compose_env=""
            if [ -z "$compose_env_candidate" ] || [ ! -r "$compose_env_candidate" ]; then
              generated_compose_env="$(mktemp /tmp/bridgeguard-compose-env.XXXXXX)"
              cat >"$generated_compose_env" <<'ENV'
          BRIDGEGUARD_ENV_FILE=/etc/bridgeguard/bridgeguard.env
          BRIDGEGUARD_AI_ENV_FILE=/etc/bridgeguard/ai.env
          BRIDGEGUARD_DATA_DIR_HOST=/srv/bridgeguard/data
          BRIDGEGUARD_MODELS_DIR=/srv/bridgeguard/models
          CLOUDFLARE_ENV_FILE=/etc/bridgeguard/cloudflare.env
          ENV
              compose_env_candidate="$generated_compose_env"
            fi
            cleanup_compose_env() {
              [ -z "$generated_compose_env" ] || rm -f "$generated_compose_env"
            }
            trap cleanup_compose_env EXIT
            export BRIDGEGUARD_COMPOSE_ENV_FILE="$compose_env_candidate"
            cd /opt/bridgeguard
            compose_file="deploy/oci/compose.yaml"
            compose() {
              docker compose --env-file "$BRIDGEGUARD_COMPOSE_ENV_FILE" -f "$compose_file" "$@"
            }
            git fetch origin main
            git cat-file -e "${deploy_sha}^{commit}"
            git merge-base --is-ancestor "$deploy_sha" origin/main
            git checkout --detach "$deploy_sha"

            sh deploy/oci/preflight.sh "$compose_file"
            # Materialize the checked-out candidate image before quiescing the
            # old release. backup.sh runs its backup and restore drill as
            # one-shot containers from this candidate image.
            compose pull embeddings cloudflared
            compose build --pull app
            sudo -n env BRIDGEGUARD_COMPOSE_ENV_FILE="$BRIDGEGUARD_COMPOSE_ENV_FILE" \
              BRIDGEGUARD_BACKUP_REUSE_SECONDS=3600 \
              sh deploy/oci/backup.sh </dev/null
            compose up \
              -d --remove-orphans embeddings app
            sh deploy/oci/wait-ready.sh "$compose_file" </dev/null
            compose up \
              -d --remove-orphans --wait --wait-timeout 120 cloudflared
            sh deploy/oci/verify.sh "$compose_file" </dev/null
          REMOTE
