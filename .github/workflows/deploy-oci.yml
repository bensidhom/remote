name: Deploy BridgeGuard to OCI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridgeguard-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: verify
    environment: production
    steps:
      - name: Configure SSH
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/bridgeguard
          chmod 600 ~/.ssh/bridgeguard
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull, rebuild, and verify
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh -i ~/.ssh/bridgeguard "$OCI_USER@$OCI_HOST" '
            set -eu
            cd /opt/bridgeguard
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose -f deploy/oci/compose.yaml up -d --build
            docker compose -f deploy/oci/compose.yaml exec -T app \
              python -c "import urllib.request; print(urllib.request.urlopen(\"http://127.0.0.1:8000/ready\", timeout=10).read().decode())"
          '
