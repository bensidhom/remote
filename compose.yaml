services:
  embeddings:
    platform: linux/amd64
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3@sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07
    command:
      - --model-id
      - nomic-ai/nomic-embed-text-v1.5
      - --revision
      - 20d1e6057a2e1fa08b45123e41ce9381fc338f0e
      - --dtype
      - float32
      - --pooling
      - mean
    volumes:
      - ./backend/data/models:/data
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  app:
    build:
      context: .
    env_file:
      - path: ${BRIDGEGUARD_ENV_FILE:-backend/.env}
    environment:
      BRIDGEGUARD_DATA_DIR: /data
      FRONTEND_DIST: /app/static
      PORT: "8000"
      TEI_EMBED_BASE_URL: http://embeddings:80
      TEI_EMBED_MODEL: nomic-ai/nomic-embed-text-v1.5
      TEI_EMBED_REVISION: 20d1e6057a2e1fa08b45123e41ce9381fc338f0e
      TEI_EMBED_DIM: "768"
      TEI_RUNTIME_VERSION: "1.9.3"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/data
    depends_on:
      embeddings:
        condition: service_healthy
    restart: unless-stopped
