services:
  embeddings:
    # The paid OCI target is VM.Standard.E4.Flex (AMD x86_64).
    platform: linux/amd64
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3@sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07
    command:
      - --model-id
      - nomic-ai/nomic-embed-text-v1.5
      - --revision
      - 20d1e6057a2e1fa08b45123e41ce9381fc338f0e
      - --dtype
      - float32
      - --pooling
      - mean
      # Preserve the model's full input length without TEI's oversized
      # 16,384-token default allocation on this 12 GB instance.
      - --max-batch-tokens
      - "8192"
    volumes:
      - ${BRIDGEGUARD_MODELS_DIR:-/srv/bridgeguard/models}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - path: ${BRIDGEGUARD_AI_ENV_FILE:-/etc/bridgeguard/ai.env}
        required: false
      # Keep the customer/deployment file last: Compose applies later env files
      # last.  AI-only settings must never override customer identity or roles.
      - path: ${BRIDGEGUARD_ENV_FILE:-/etc/bridgeguard/bridgeguard.env}
    environment:
      BRIDGEGUARD_ENV: production
      # This repository and OCI stack are research-only. Keep commercial and
      # scientific-publication interlocks out of the deploy path while the UI
      # continues to label derived outputs as screening/research evidence.
      BRIDGEGUARD_DEPLOYMENT_MODE: research_shared
      BRIDGEGUARD_REQUIRE_COMMERCIAL_READY: "false"
      # Workspace identity, worker count, and role lists come only
      # from BRIDGEGUARD_ENV_FILE. Service-level environment values override
      # env_file values, so do not mirror those values here with host-shell
      # interpolation defaults.
      BRIDGEGUARD_COOKIE_SECURE: "true"
      BRIDGEGUARD_DATA_DIR: /data
      RAG_WORKING_DIR: /data/rag_storage
      SNBI_TEMP_DIR: /data/temp
      FRONTEND_DIST: /app/static
      PORT: "8000"
      TEI_EMBED_BASE_URL: http://embeddings:80
      TEI_EMBED_MODEL: nomic-ai/nomic-embed-text-v1.5
      TEI_EMBED_REVISION: 20d1e6057a2e1fa08b45123e41ce9381fc338f0e
      TEI_EMBED_DIM: "768"
      TEI_RUNTIME_VERSION: "1.9.3"
      # One report chunk per request avoids CPU-side timeouts and leaves room
      # for interactive query embeddings on the 2-vCPU OCI shape.
      TEI_EMBED_BATCH: "1"
    volumes:
      - ${BRIDGEGUARD_DATA_DIR_HOST:-/srv/bridgeguard/data}:/data
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      embeddings:
        condition: service_healthy

  cloudflared:
    platform: linux/amd64
    image: cloudflare/cloudflared:2026.7.2-amd64
    command: tunnel --no-autoupdate run
    env_file:
      - ${CLOUDFLARE_ENV_FILE:-/etc/bridgeguard/cloudflare.env}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
