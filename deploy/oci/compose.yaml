services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - /etc/bridgeguard/bridgeguard.env
    environment:
      BRIDGEGUARD_ENV: production
      BRIDGEGUARD_COOKIE_SECURE: "true"
      BRIDGEGUARD_DATA_DIR: /data
      FRONTEND_DIST: /app/static
      PORT: "8000"
    volumes:
      - /srv/bridgeguard/data:/data
    restart: unless-stopped
    expose:
      - "8000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    env_file:
      - /etc/bridgeguard/cloudflare.env
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

